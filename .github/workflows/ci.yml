name: CI

on:
  # every push, on any branch
  push:
    branches: ["**"]
  # every pull request into yas (the default branch)
  pull_request:
    branches: [yas]
  # "Run workflow" button on the Actions tab
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - lint and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: consentledger
          POSTGRES_USER: consentledger
          POSTGRES_PASSWORD: consentledger
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U consentledger -d consentledger"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://consentledger:consentledger@localhost:5432/consentledger
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      ENCRYPTION_KEY: ci-only-encryption-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PostgreSQL client (pg_dump/pg_restore for the restore test)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client  # v16 on ubuntu-24.04
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm
      - name: Lint
        run: |
          ruff check database backend ai conftest.py scripts
          black --check database backend ai conftest.py scripts
      - name: Migrations (upgrade, downgrade, upgrade)
        run: |
          python -m database.migrate
          python -m database.migrate downgrade base
          python -m database.migrate
      - name: Tests
        run: python -m pytest --cov=database --cov=backend --cov=ai --cov-report=term-missing
      - name: OpenAPI spec is up to date
        run: |
          python scripts/export_openapi.py
          git diff --exit-code docs/api/openapi.json || (echo "Run: python scripts/export_openapi.py" && exit 1)

  frontend:
    name: Frontend - lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  build:
    name: Build images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f backend/Dockerfile -t consentledger-api:ci .
      - name: Build web image
        run: docker build -t consentledger-web:ci frontend
