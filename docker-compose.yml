version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: consentledger-db
    environment:
      POSTGRES_DB: consentledger
      POSTGRES_USER: consentledger
      POSTGRES_PASSWORD: consentledger
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consentledger -d consentledger"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - consentledger-net

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: consentledger-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@consentledger.local
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - consentledger-net
    profiles:
      - tools

  # Optional: Redis for caching/sessions
  redis:
    image: redis:7-alpine
    container_name: consentledger-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - consentledger-net
    profiles:
      - cache

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:

networks:
  consentledger-net:
    driver: bridge