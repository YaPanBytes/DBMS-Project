[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "consentledger"
version = "0.1.0"
description = "Data-sharing hub with per-field, purpose-bound consent enforced in PostgreSQL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "pyjwt>=2.8",
    "bcrypt>=4.0",
    "google-auth>=2.30",
    "requests>=2.31",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "joblib>=1.3",
    "faker>=24.0",
]

[project.optional-dependencies]
ner = ["spacy>=3.7"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "black>=24.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["database*", "backend*", "ai*"]

[tool.setuptools.package-data]
database = ["migrations/*.sql", "migrations/down/*.sql", "queries/*.sql", "alembic_env/*.py", "alembic_env/*.mako", "alembic_env/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["database", "backend/tests", "ai/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T10", "ARG", "PL"]
ignore = [
    "PLR0913",  # procedures/helpers legitimately take many arguments
    "PLR2004",  # magic values are fine in tests and seed data
    "PLR0915",
    "PLC0415",  # local imports are used to avoid import cycles
    "PLR0911",  # mapping functions legitimately return early
    "E501",     # line length is handled by black
    "PLR0917",
    "PLR0912",
    "PLW1510",  # subprocess return codes are checked explicitly
    "UP042",    # (str, Enum) is intentional for SQLAlchemy/JSON friendliness
]

[tool.ruff.lint.per-file-ignores]
"database/seeds/*.py" = ["T201"]
"database/scripts/*.py" = ["T201"]
"database/migrate.py" = ["T201"]
# FastAPI dependencies such as `current: AuthUser` enforce auth without being read
"backend/app/routers/*.py" = ["ARG001"]
# pytest fixtures are requested for their side effects
"**/test_*.py" = ["ARG001", "ARG002", "ARG005"]
"conftest.py" = ["ARG001", "PLW0603"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
