[project]
name = "consentledger"
version = "0.1.0"
description = "PostgreSQL-backed data-sharing hub with per-field consent enforcement"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.12.0",
    "passlib[bcrypt]>=1.7.4",
    "faker>=20.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "ipython>=8.15.0",
]

[tool.pytest.ini_options]
testpaths = ["database"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T10", "T20", "ANN", "ARG", "PTH", "ERA", "PL", "TRY", "NPY", "FA"]
ignore = ["ANN101", "ANN102", "ANN201", "ARG001", "ARG002", "TRY003"]
per-file-ignores = {
    "database/test_db.py": ["S101", "S106"],
}

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.sqlalchemy]
# SQLAlchemy 2.0 style
future = true